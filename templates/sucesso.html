<!DOCTYPE html>
<html lang="pt-br">
<head>
	<link rel="icon" href="/static/icon.png" type="image/png">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição confirmada</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <aside class="menu-lateral">
        <div class="hamburguer">
            <a href="/">
                <img src="/static/logo-hackathon.png"
                     alt="Logo Hackathon"
                     class="logo-hackathon">
            </a>
        </div>
    </aside>

    <main class="pagina-confirmacao">

        <div class="card-confirmacao">

            <h1>Tudo certo, {{ team_name }}!</h1>

            <p>
                Parabens! A sua inscrição foi confirmada e sua conta do GitHub
                (<strong>{{ github_username }}</strong>) foi vinculada com sucesso!
            </p>
			<img
    src="https://media.tenor.com/pkmwcXNSOfoAAAAM/awesome-computer-kid-computer.gif"
    alt="bruce typing"
    class="gif-hackathon"
>
            <p>
                Lembre-se: o repositório do projeto deve se chamar
                <strong>hackathon-ifpr</strong> e estar
                <strong>público</strong> na sua conta do GitHub.
            </p>
			<!---
            <p class="boa-sorte">
                Boa sorte no Hackathon! 🚀
            </p>

            <div class="bloco-link">

                <h3>Guarde este link!</h3>

                <p>
                    Use-o sempre que quiser voltar à área da sua equipe:
                </p>

                <a href="{{ link_area_equipe }}" class="link-equipe">
                    {{ link_area_equipe }}
                </a>-->

            </div>
			<a
                href="/"
                class="botao-inscrever"
                style="display:inline-block; width:auto; text-decoration:none;"
            >
                 Voltar à página inicial
			</a>
        </div>

    </main>

</body>
</html>
