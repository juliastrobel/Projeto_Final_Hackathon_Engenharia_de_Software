<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Hackathon IFPR</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="menu-lateral">
        <div class="hamburguer">
            <a href="/">
                <img
                    src="/static/logo-hackathon.png"
                    alt="Logo Hackathon"
                    class="logo-hackathon"
                >
            </a>
        </div>
    </aside>
    <main class="pagina-inscricao">
        <div class="formulario-inscricao">
            <h1 class="titulo-resultados">
                Resultados
            </h1>
            <p class="subtitulo">
                Ranking final - Hackathon IFPR Pinhais
            </p>

            <table class="tabela-commits">
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Equipe</th>
                        <th>Nota</th>
                    </tr>
                </thead>
                <tbody>
                    {% for r in ranking %}
                    <tr class="{{ 'linha-suspeita' if loop.index == 1 else '' }}">
                        <td>{{ loop.index }}º</td>
                        <td>{{ r.team_name }}</td>
                        <td>{{ "%.1f"|format(r.media) }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="/" class="botao-inscrever" style="display:block; text-decoration:none; text-align:center;">
                Voltar à página inicial
            </a>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
