<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="/static/icon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login da Equipe</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <aside class="menu-lateral">

        <div class="hamburguer">
            <a href="/">
                <img
                    src="/static/logo-hackathon.png"
                    alt="Logo Hackathon"
                    class="logo-hackathon"
                >
            </a>
        </div>

    </aside>

    <main class="pagina-inscricao">

        <h1>Área da Equipe</h1>

        <p class="subtitulo">
            { Hackathon IFPR Pinhais }
        </p>

        {% if erro %}

            <div class="mensagem-erro">
                {{ erro }}
            </div>

        {% endif %}

        <form
            method="post"
            action="/equipe/login"
            class="formulario-inscricao"
        >

            <div class="campo">

                <label for="email">
                    E-mail do líder cadastrado
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email or '' }}"
                    required
                    autocomplete="email"
                >

            </div>
            <button type="submit" class="botao-github">
    Continuar com GitHub

    <svg xmlns="http://w3.org"
         viewBox="0 0 24 24"
         width="24"
         height="24"
         fill="currentColor">
        <path d="M12.5.75C6.146.75 1 5.896 1 12.25c0 5.081 3.293 9.388 7.863 10.91.575.101.78-.247.78-.55 0-.273-.01-1.002-.015-1.967-3.199.692-3.873-1.54-3.873-1.54-.523-1.327-1.277-1.68-1.277-1.68-1.044-.714.078-.7.078-.7 1.154.08 1.762 1.184 1.762 1.184 1.026 1.758 2.688 1.25 3.344.956.104-.742.402-1.25.731-1.537-2.554-.29-5.24-1.277-5.24-5.686 0-1.256.447-2.283 1.182-3.087-.117-.29-.512-1.46.113-3.04 0 0 .966-.31 3.164 1.18a11.003 11.003 0 0 1 5.756 0c2.196-1.49 3.16-1.18 3.16-1.18.627 1.58.232 2.75.115 3.04.737.804 1.18 1.83 1.18 3.087 0 4.42-2.69 5.393-5.251 5.677.413.355.78 1.055.78 2.128 0 1.536-.014 2.774-.014 3.152 0 .306.203.657.787.542C19.709 21.634 23 17.329 23 12.25 23 5.896 17.854.75 12.5.75Z"/>
    </svg>
</button>

        </form>

    </main>

</body>
</html>
